{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SugarLert{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/css/styles.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <main class="screen">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="#145C54"/>
          <path d="M20 9c4.5 5.4 8 10.1 8 14.2A8 8 0 1 1 12 23.2C12 19.1 15.5 14.4 20 9Z" fill="#E2A63B"/>
        </svg>
      </span>
      <span class="brand-name">SugarLert</span>
    </div>

    <div class="card">
      {% if messages %}
        <ul class="messages">
          {% for message in messages %}
            <li class="message message--{{ message.tags }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
